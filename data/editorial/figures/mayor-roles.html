<figure class="editorial-figure" id="mayor-roles"><h3>新しい予算を伴う学校施策の役割</h3><p>市長と教育委員会が関わり、市会が予算を審議する。</p><ol class="role-flow"><li><span>案をつくる</span><strong>市長</strong><p>対象と費用を組み立て、予算案を提出。教育関係では教育委員会の意見を聴く。</p></li><li><span>審議・議決する</span><strong>市会</strong><p>予算案を審議し、市の支出を決める。</p></li><li><span>それぞれの権限で実施する</span><strong>市長・教育委員会</strong><p>市長は予算執行・契約。教育委員会は学校の管理・給食等を担う。</p></li></ol><p>組織の上下関係を示す図ではない。具体策によって条例改正や実務上の調整も必要になる。</p><figcaption><a href="https://laws.e-gov.go.jp/law/322AC0000000067_20260903_508AC0000000027">地方自治法96・149・211・218条</a>、<a href="https://laws.e-gov.go.jp/law/331AC0000000162_20260401_507AC0000000068">地方教育行政法21・22・29条</a>を基に当サイトが整理。2026年9月9日時点。すべての執行事務や特例を示すものではない。</figcaption></figure>
