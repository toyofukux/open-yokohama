<figure class="editorial-figure" id="mobility-support"><h3>運賃と運行では、働きかける条件が違う</h3><ul class="role-flow"><li><span>対象交通に乗れる人の負担へ</span><strong>運賃を支える</strong><p>敬老パスなどで利用者の負担を軽くする。対象年齢・所得・交通機関によって届く範囲が変わる。</p></li><li><span>乗れる場所や便の不足へ</span><strong>交通の運行を支える</strong><p>ルートの検討、運行経費や車両導入への支援。運転士・運行時間・継続する財源も必要になる。</p></li></ul><p>二つの支援は組み合わせられる。乗り場までの移動と、目的地から帰る便まで確かめる。</p><figcaption><a href="https://www.city.yokohama.lg.jp/kenko-iryo-fukushi/fukushi-kaigo/koreisha-kaigo/kaigoyobo-kenkoudukuri-ikigai/ikigai-shakaisanka/keirou.html">敬老パス</a>、<a href="https://www.city.yokohama.lg.jp/kurashi/machizukuri-kankyo/kotsu/chiikikokyo/huyasu/odekake/aratanaseido.html">みんなのおでかけ交通事業</a>、<a href="https://www.city.yokohama.lg.jp/kurashi/machizukuri-kankyo/kotsu/toshikotsu/plan/chiki-kotsu-plan.files/0027_20250410.pdf#page=7">2025年地域公共交通計画・本文9ページ</a>を基に当サイトが整理。具体策の費用や効果を比較した図ではない。</figcaption></figure>
