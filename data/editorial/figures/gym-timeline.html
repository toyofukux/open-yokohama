<figure class="editorial-figure" id="gym-timeline"><h3>計画・設計・着手を分けた整備の経緯</h3><ol class="policy-timeline"><li><span>2019年度</span><div><strong>調査・モデル設置</strong><p>設置方法を調べ、モデル設置を開始。</p></div></li><li><span>2021年度</span><div><strong>整備を本格化</strong><p>年間20校の整備を進める。</p></div></li><li><span>2025年度</span><div><strong>完了目標を5年前倒し</strong><p>2034年度から2029年度へ。建替え校等を除く。</p></div></li><li><span>2025年度12月補正</span><div><strong>設計を追加</strong><p>既実施80校＋追加68校＝設計148校。</p></div></li><li><span>2026年度</span><div><strong>設置着手の目標123件</strong><p>完成・稼働の実績ではない。</p></div></li></ol><figcaption>横浜市の<a href="https://www.city.yokohama.lg.jp/city-info/yokohamashi/org/kyoiku/jigyoukeikaku/r8jigyoukeikaku.files/0240_20260209.pdf#page=22">事業計画書・本文21ページ</a>、<a href="https://www.city.yokohama.lg.jp/city-info/koho-kocho/press/somu/2025/1127r74teiippangian.files/0004_20251125.pdf#page=13">12月補正・本文12ページ</a>、<a href="https://cgi.city.yokohama.lg.jp/shimin/kouchou/search/data/37002833.html">市民の声への回答</a>を基に当サイト作成。年表の各数値は異なる工程を指す。</figcaption></figure>
