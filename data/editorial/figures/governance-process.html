  <p class="figure-title" id="governance-process-title">調査の認定と、本人の説明を分ける</p>
  <ol class="policy-timeline">
    <li><strong>2026年1月</strong><div>職員の告発・会見、市会の真相究明を求める決議。<p>告発内容をすべて確定事実とする段階ではない。</p></div></li>
    <li><strong>7月30日付</strong><div>第三者の調査報告書。<p>個別事項の認定・非認定、総合評価、再発防止の提言。</p></div></li>
    <li><strong>8月28日</strong><div>市長会見で謝罪と辞職の決断を表明。<p>本人の説明。提言の実施や裁判の判断とは別。</p></div></li>
  </ol>
