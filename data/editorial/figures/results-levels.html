<figure class="editorial-figure policy-visual" id="results-levels" aria-labelledby="results-levels-title">
  <h3 id="results-levels-title">実施が進んだことと、暮らしが変わったこと</h3>
  <ol class="visual-steps">
    <li><strong>目標・予算：何をする予定か</strong><span>いつまでに、どれだけ行うか。予定が示されても、実行済みとは言えない。</span></li>
    <li><strong>実施量：どこまで進んだか</strong><span>工事、支援、利用などの実績。量だけでは、困りごとの改善は分からない。</span></li>
    <li><strong>生活上の結果：何が変わったか</strong><span>利用できる時間、負担、困難の変化。ただし、変化のすべてが政策によるとは限らない。</span></li>
  </ol>
  <div class="visual-separate"><strong>政策の効果は、さらに別の比較が必要</strong><span>政策がなかった場合と比べ、何が変わったかを確かめる。他の要因も考慮し、他地域や将来へ同じ結果をそのまま当てはめない。</span></div>
  <figcaption>当サイトによる評価の読み方の整理。矢印や段階別の達成率で因果関係を示す図ではない。個別施策の効果を検証した結果ではなく、本文の具体例を読むための区分。</figcaption>
</figure>
