<figure class="editorial-figure" id="housing-support" aria-labelledby="housing-support-title">
  <p class="figure-title" id="housing-support-title">住まいの確保には、三つの条件がある</p>
  <ol class="role-flow">
    <li><strong>借りられる</strong><span>受入れ住宅、貸主、保証などの条件が合う。</span></li>
    <li><strong>払い続けられる</strong><span>所得と家賃が合う。補助を使う場合は住宅・入居者・申請要件を確かめる。</span></li>
    <li><strong>住み続けられる</strong><span>本人の希望に応じて、見守りや福祉につながる。</span></li>
  </ol>
  <figcaption>横浜市のセーフティネット住宅等の案内を基にopen.yokohamaが整理。登録だけで家賃補助が付くことや、個人の入居資格を示す図ではない。</figcaption>
</figure>
