name: 数字・説明の訂正
description: 開発や記事づくりに参加する方向けの訂正提案です。一般の方は https://open.yokohama/corrections/ のフォームをご利用ください（アカウント不要）。
title: '[訂正] '
labels: []
body:
  - type: input
    id: page
    attributes:
      label: ページのURL
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 対象箇所・表示していた版
  - type: textarea
    id: problem
    attributes:
      label: 該当箇所と誤りの内容
      description: 公開されるため、個人情報を書かないでください。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 出典や補足（任意）
    validations:
      required: false
