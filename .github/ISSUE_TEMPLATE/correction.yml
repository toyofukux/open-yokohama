name: 数字・説明の訂正
description: 気になる点をお知らせください。出典は分かる範囲で構いません。
title: '[訂正] '
labels: []
body:
  - type: input
    id: page
    attributes:
      label: ページのURL
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 対象箇所・表示していた版
  - type: textarea
    id: problem
    attributes:
      label: 該当箇所と誤りの内容
      description: 公開されるため、個人情報を書かないでください。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 出典や補足（任意）
    validations:
      required: false
