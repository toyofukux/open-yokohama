name: Check official data updates
on:
  schedule:
    - cron: '25 21 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh each family independently (candidate only)
        run: pnpm data:refresh:all
      - name: Confirm published release remains valid
        if: always()
        run: pnpm dwh:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-update-candidate
          path: |
            artifacts/
            data/
          retention-days: 30
