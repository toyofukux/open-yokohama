<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>子ども数と保育所の申込数｜グラフ表示見本</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f5f6f7;
        color: #172f3b;
        font-family:
          system-ui,
          -apple-system,
          "Hiragino Kaku Gothic ProN",
          sans-serif;
        line-height: 1.7;
      }
      main {
        max-width: 760px;
        margin: 32px auto;
        padding: 28px;
        background: #fff;
        border: 1px solid #d6dce0;
        border-radius: 12px;
      }
      h1 {
        font-size: clamp(22px, 4vw, 28px);
        line-height: 1.5;
        margin: 8px 0;
      }
      h1 span {
        display: inline-block;
      }
      .label {
        font-size: 13px;
        color: #435660;
        margin: 0;
      }
      figure {
        margin: 22px 0 0;
        padding: 20px;
        background: #f7f9fa;
        border: 1px solid #d6dce0;
      }
      .chart-title {
        font-size: 17px;
        font-weight: 700;
        line-height: 1.6;
        margin: 0 0 12px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 20px;
        list-style: none;
        margin: 0 0 22px;
        padding: 0;
        font-size: 14px;
      }
      .legend li {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .swatch {
        width: 12px;
        height: 12px;
        display: inline-block;
      }
      .blue {
        background: #206095;
      }
      .orange {
        background: #a34b00;
      }
      .chart {
        padding-left: 36px;
        padding-right: 2px;
      }
      .unit {
        font-size: 12px;
        color: #435660;
        margin-bottom: 12px;
      }
      .plot {
        height: 240px;
        position: relative;
      }
      .tick {
        position: absolute;
        left: 0;
        right: 0;
        border-top: 1px solid #c5cdd2;
        height: 0;
      }
      .tick:first-child {
        border-color: #657580;
      }
      .tick > span {
        position: absolute;
        right: calc(100% + 8px);
        top: 0;
        transform: translateY(-50%);
        font-size: 12px;
        white-space: nowrap;
        color: #435660;
      }
      .groups {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 32px;
        padding: 0 12px;
      }
      .year-group {
        height: 100%;
        min-width: 0;
        position: relative;
      }
      .bars {
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        max-width: 170px;
        margin: auto;
      }
      .bar-column {
        position: relative;
        display: flex;
        align-items: flex-end;
        height: 100%;
        justify-content: center;
      }
      .bar {
        width: 100%;
        max-width: 64px;
        position: relative;
      }
      .value {
        position: absolute;
        bottom: calc(100% + 4px);
        left: 50%;
        transform: translateX(-50%);
        font-size: 13px;
        font-weight: 650;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .series-label {
        position: absolute;
        top: calc(100% + 4px);
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        white-space: nowrap;
      }
      .year {
        position: absolute;
        top: calc(100% + 26px);
        left: 0;
        right: 0;
        text-align: center;
        font-size: 15px;
        font-weight: 650;
      }
      .chart-bottom {
        margin-top: 66px;
      }
      .takeaway {
        font-size: 15px;
        margin: 0 0 12px;
      }
      .takeaway span {
        display: inline-block;
      }
      .note,
      .source {
        font-size: 13px;
        color: #435660;
        margin: 10px 0;
      }
      a {
        color: #174f82;
        text-underline-offset: 3px;
      }
      summary {
        cursor: pointer;
        font-size: 14px;
      }
      details {
        margin: 12px 0;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        margin-top: 12px;
      }
      th,
      td {
        padding: 8px;
        border-bottom: 1px solid #d6dce0;
        text-align: right;
        white-space: nowrap;
      }
      th:first-child {
        text-align: left;
      }
      caption {
        text-align: left;
        font-size: 13px;
      }
      :focus-visible {
        outline: 3px solid #206095;
        outline-offset: 4px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      @media (max-width: 520px) {
        main {
          margin: 0;
          padding: 16px;
          border: 0;
          border-radius: 0;
        }
        figure {
          padding: 14px 10px;
          margin-top: 18px;
        }
        .chart-title {
          font-size: 16px;
        }
        .legend {
          font-size: 13px;
          gap: 3px 12px;
        }
        .groups {
          gap: 18px;
          padding: 0 4px;
        }
        .bars {
          gap: 8px;
        }
        .value {
          font-size: 11px;
        }
        .plot {
          height: 210px;
        }
        .series-label {
          font-size: 11px;
        }
        .chart {
          padding-left: 30px;
          padding-right: 0;
        }
        .tick > span {
          font-size: 11px;
          right: calc(100% + 6px);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">表示見本 v2・公開記事への組込み前</p>
      <h1>
        子どもが減っても、<br /><span>保育所への申込みは</span
        ><span>増えていた</span>
      </h1>
      <figure aria-labelledby="chart-title">
        <figcaption class="chart-title" id="chart-title">
          子ども数と保育所への申込数
        </figcaption>
        <ul class="legend">
          <li>
            <span class="swatch blue" aria-hidden="true"></span
            >就学前児童数（子ども）
          </li>
          <li>
            <span class="swatch orange" aria-hidden="true"></span
            >保育所入所申込数（申込み）
          </li>
        </ul>
        <div
          class="chart"
          role="img"
          aria-label="横浜市、各年4月1日の人数。2004年は就学前児童201,626人、保育所入所申込28,112人。2012年は就学前児童191,770人、保育所入所申込45,707人。共通の0〜25万人の目盛り。"
        >
          <div aria-hidden="true">
            <div class="unit">人数（人）</div>
            <div class="plot">
              <div class="tick" style="bottom: 0%"><span>0</span></div>
              <div class="tick" style="bottom: 20%"><span>5万</span></div>
              <div class="tick" style="bottom: 40%"><span>10万</span></div>
              <div class="tick" style="bottom: 60%"><span>15万</span></div>
              <div class="tick" style="bottom: 80%"><span>20万</span></div>
              <div class="tick" style="bottom: 100%"><span>25万</span></div>
              <div class="groups">
                <div class="year-group">
                  <div class="bars">
                    <div class="bar-column">
                      <div
                        class="bar blue"
                        data-value="201626"
                        style="height: 80.6504%"
                      >
                        <span class="value">201,626</span>
                      </div>
                      <span class="series-label">子ども</span>
                    </div>
                    <div class="bar-column">
                      <div
                        class="bar orange"
                        data-value="28112"
                        style="height: 11.2448%"
                      >
                        <span class="value">28,112</span>
                      </div>
                      <span class="series-label">申込み</span>
                    </div>
                  </div>
                  <span class="year">2004年</span>
                </div>
                <div class="year-group">
                  <div class="bars">
                    <div class="bar-column">
                      <div
                        class="bar blue"
                        data-value="191770"
                        style="height: 76.708%"
                      >
                        <span class="value">191,770</span>
                      </div>
                      <span class="series-label">子ども</span>
                    </div>
                    <div class="bar-column">
                      <div
                        class="bar orange"
                        data-value="45707"
                        style="height: 18.2828%"
                      >
                        <span class="value">45,707</span>
                      </div>
                      <span class="series-label">申込み</span>
                    </div>
                  </div>
                  <span class="year">2012年</span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="chart-bottom">
          <p class="takeaway">
            <span><strong>子どもは4.9％減</strong>、</span
            ><span><strong>申込みは62.6％増</strong>。</span>
          </p>
          <p class="note">
            横浜市・各年4月1日。2時点の比較であり、途中の動きや増減の原因は示さない。申込数は、保育を必要とする全家庭の数ではない。
          </p>
          <details>
            <summary>図の数値を表で確認する</summary>
            <div
              class="table-wrap"
              tabindex="0"
              role="region"
              aria-label="図の数値表。狭い画面では横にスクロールできる"
            >
              <table>
                <caption>
                  人数の単位は人。増減率は2004年比。
                </caption>
                <thead>
                  <tr>
                    <th scope="col">指標</th>
                    <th scope="col">2004年</th>
                    <th scope="col">2012年</th>
                    <th scope="col">人数差</th>
                    <th scope="col">増減率</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <th scope="row">就学前児童数</th>
                    <td>201,626</td>
                    <td>191,770</td>
                    <td>-9,856</td>
                    <td>-4.9％</td>
                  </tr>
                  <tr>
                    <th scope="row">保育所入所申込数</th>
                    <td>28,112</td>
                    <td>45,707</td>
                    <td>+17,595</td>
                    <td>+62.6％</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </details>

          <p class="source">
            出典：<a
              href="https://www.city.yokohama.lg.jp/city-info/seisaku/torikumi/shien/tyousakihou/kihou-archive/172.files/0007_20191119.pdf#page=1"
              >横浜市『調査季報172号』11ページ・表1</a
            >を基にOpen Yokohama作成。増減率は各指標の2004年比。
          </p>
        </div>
      </figure>
    </main>
  </body>
</html>
